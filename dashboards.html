<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rodízio de Dashboards · Almoxarifado</title>
<style>
  :root{
    --verde: #95C33D;
    --preto: #262626;
    --branco: #FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background: var(--preto);
    font-family: -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #frame-wrap{
    position: fixed;
    inset: 0;
  }
  iframe{
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  #loading{
    position: fixed;
    inset: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--branco);
    font-size: 14px;
    letter-spacing: 0.04em;
    background: var(--preto);
  }

  #bar{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 10px 18px;
    background: rgba(38,38,38,0.92);
    backdrop-filter: blur(6px);
    color: var(--branco);
    font-size: 13px;
    opacity: 0;
    transform: translateY(100%);
    transition: opacity .25s ease, transform .25s ease;
  }
  #frame-wrap:hover ~ #bar,
  #bar:hover,
  #bar.show{
    opacity: 1;
    transform: translateY(0);
  }

  #bar button{
    background: rgba(255,255,255,0.08);
    border: none;
    color: var(--branco);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s ease;
  }
  #bar button:hover, #bar button:focus-visible{
    background: var(--verde);
    color: var(--preto);
    outline: none;
  }
  #titulo{
    font-weight: 700;
    flex: 1;
  }
  #contador{
    color: #B5B5B5;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div id="frame-wrap">
  <div id="loading">Carregando dashboard…</div>
</div>

<div id="bar" class="show">
  <span id="titulo">—</span>
  <span id="contador">1 / 1</span>
  <button id="btn-prev" title="Anterior" aria-label="Dashboard anterior">‹</button>
  <button id="btn-play" title="Pausar/Retomar" aria-label="Pausar ou retomar rodízio">❚❚</button>
  <button id="btn-next" title="Próximo" aria-label="Próximo dashboard">›</button>
  <button id="btn-full" title="Tela cheia" aria-label="Alternar tela cheia">⛶</button>
</div>

<script>
  // ---- Configure aqui seus dashboards (mesma lista da vitrine, na ordem de exibição) ----
  const dashboards = [
    { titulo: "Pedidos de Compra",          url: "https://app.powerbi.com/view?r=eyJrIjoiMmM0YjU0NGMtYmI2Ni00MzdmLTg3MzktN2RkZGZjMDM5ZWFkIiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9" },
    { titulo: "Estudo de Pneus",        url: "https://app.powerbi.com/view?r=eyJrIjoiMmJjNGViZDUtZjQ4YS00YTgyLTk1YmQtYzM5YTMyNmZkY2ViIiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9&pageName=23264a554ea505406574" },
  ];
  const INTERVALO_MS = 30000; // tempo de cada dashboard na tela (30s)

  let idx = 0;
  let timer = null;
  let tocando = true;

  const wrap = document.getElementById('frame-wrap');
  const titulo = document.getElementById('titulo');
  const contador = document.getElementById('contador');
  const btnPlay = document.getElementById('btn-play');
  const bar = document.getElementById('bar');

  function render(){
    const item = dashboards[idx];
    wrap.innerHTML = '<div id="loading">Carregando dashboard…</div>';
    const iframe = document.createElement('iframe');
    iframe.src = item.url;
    iframe.allowFullscreen = true;
    iframe.onload = () => {
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
    };
    wrap.appendChild(iframe);
    titulo.textContent = item.titulo;
    contador.textContent = (idx + 1) + ' / ' + dashboards.length;
  }

  function iniciarTimer(){
    clearInterval(timer);
    timer = setInterval(() => {
      idx = (idx + 1) % dashboards.length;
      render();
    }, INTERVALO_MS);
  }

  function proximo(){
    idx = (idx + 1) % dashboards.length;
    render();
    if (tocando) iniciarTimer();
  }
  function anterior(){
    idx = (idx - 1 + dashboards.length) % dashboards.length;
    render();
    if (tocando) iniciarTimer();
  }
  function alternarPlay(){
    tocando = !tocando;
    btnPlay.textContent = tocando ? '❚❚' : '▶';
    if (tocando) iniciarTimer(); else clearInterval(timer);
  }
  function alternarTelaCheia(){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }

  document.getElementById('btn-next').addEventListener('click', proximo);
  document.getElementById('btn-prev').addEventListener('click', anterior);
  document.getElementById('btn-play').addEventListener('click', alternarPlay);
  document.getElementById('btn-full').addEventListener('click', alternarTelaCheia);

  // esconde a barra de controle após alguns segundos parado, mostra ao mover o mouse
  let hideTimeout;
  function mostrarBarra(){
    bar.classList.add('show');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => bar.classList.remove('show'), 4000);
  }
  document.addEventListener('mousemove', mostrarBarra);
  mostrarBarra();

  render();
  iniciarTimer();
</script>

</body>
</html>
