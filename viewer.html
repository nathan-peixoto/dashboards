<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dashboard · Grupo GBS</title>
<style>
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #262626;
    font-family: -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
  }

  .frame-wrap{
    position: relative;
    width: 100vw;
    height: 100vh;   /* fallback */
    height: 100dvh;  /* mobile: ignora a barra de endereço dinâmica */
    overflow: hidden;
  }

  /*
    O iframe é renderizado mais alto do que a tela (altura real do relatório + a
    altura do rodapé "Microsoft Power BI"). Como o container pai tem overflow:hidden
    e altura fixa, esse excesso na parte de baixo (o rodapé) fica cortado
    e nunca aparece na tela.

    O rodapé pode ter uma altura diferente entre desktop e mobile (o app mobile do
    Power BI costuma renderizar um rodapé um pouco mais alto). Por isso cada
    relatório define dois valores separados na tabela RELATORIOS:
    footerHeightDesktop e footerHeightMobile. Ajuste-os se o rodapé mudar de
    tamanho em algum zoom/breakpoint.
  */
  iframe{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    border: 0;
    display: block;
    height: calc(100% + var(--footer-height, 60px));
  }

  /* tela de erro, exibida se o ?id= não existir na tabela de relatórios */
  .erro{
    display: none;
    height: 100%;
    color: #F2F2F2;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    text-align: center;
    padding: 24px;
  }
  .erro h1{
    font-size: 18px;
    color: #95C33D;
  }
  .erro p{
    font-size: 14px;
    color: #B5B5B5;
    max-width: 420px;
  }
  .erro a{
    margin-top: 6px;
    color: #95C33D;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
  }
  .erro a:hover, .erro a:focus-visible{ text-decoration: underline; }
  .erro.ativo{ display: flex; }
</style>
</head>
<body>

<div class="frame-wrap" id="frameWrap">
  <iframe
    id="reportFrame"
    title="Dashboard Grupo GBS"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox">
  </iframe>
</div>

<div class="erro" id="erroBox">
  <h1>Dashboard não encontrado</h1>
  <p>O identificador informado na URL não corresponde a nenhum relatório cadastrado. Verifique o link ou volte para a página de dashboards.</p>
  <a href="index.html">← Voltar para os dashboards</a>
</div>

<script>
  /*
    TABELA DE RELATÓRIOS
    ---------------------
    Para adicionar um novo dashboard no futuro, basta acrescentar uma entrada
    aqui (e o card correspondente no index.html) — não é preciso criar nenhum
    arquivo .html novo.

    chave:        o "id" usado na URL (viewer.html?id=chave)
    title:        título da aba do navegador / atributo title do iframe
    srcDesktop:          link do Power BI para desktop (nunca aparece na barra de endereço)
    srcMobile:           link do Power BI para mobile — se null, cai no srcDesktop
    footerHeightDesktop: altura em px do rodapé do Power BI na versão desktop desse relatório
    footerHeightMobile:  altura em px do rodapé do Power BI na versão mobile desse relatório
                         (o app mobile do Power BI costuma ter um rodapé mais alto que o desktop)
  */
  var RELATORIOS = {
    "pedidos-compra": {
      title: "Pedidos de Compra · Grupo GBS",
      srcDesktop: "https://app.powerbi.com/view?r=eyJrIjoiMDlkNzk5NTQtOTg3My00NGYyLTliNGYtNjI1MGQ1YTU4ZWQ2IiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9&pageName=20978b144b646948676b",
      srcMobile:  "https://app.powerbi.com/view?r=eyJrIjoiMDlkNzk5NTQtOTg3My00NGYyLTliNGYtNjI1MGQ1YTU4ZWQ2IiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9&pageName=2e7ee7e83a7fac58aea8",
      footerHeightDesktop: 60,
      footerHeightMobile: 30
    },
    "fluxo-compras": {
      title: "Fluxo de Compras · Grupo GBS",
      srcDesktop: "https://app.powerbi.com/view?r=eyJrIjoiMDlkNzk5NTQtOTg3My00NGYyLTliNGYtNjI1MGQ1YTU4ZWQ2IiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9&pageName=3129c3f9ee3d77089ff6",
      srcMobile:  null,
      footerHeightDesktop: 60,
      footerHeightMobile: 30
    },
    "pecas-estoque": {
      title: "Peças e Posição do Estoque · Grupo GBS",
      srcDesktop: "https://app.powerbi.com/view?r=eyJrIjoiMDlkNzk5NTQtOTg3My00NGYyLTliNGYtNjI1MGQ1YTU4ZWQ2IiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9&pageName=e53aedc0b04e5940fe4c",
      srcMobile:  null,
      footerHeightDesktop: 60,
      footerHeightMobile: 30
    },
    "posicao-estoque": {
      title: "Posição do Estoque · Grupo GBS",
      srcDesktop: "https://app.powerbi.com/view?r=eyJrIjoiODQ0Y2Q2MjctN2U5Yy00MmRkLWI1YmMtYTEzMDEwMDhjN2ExIiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9&pageName=63da9a53148a46baa8ff",
      srcMobile:  null,
      footerHeightDesktop: 60,
      footerHeightMobile: 30
    },
    "estudo-pneus": {
      title: "Estudo de Pneus · Grupo GBS",
      srcDesktop: "https://app.powerbi.com/view?r=eyJrIjoiMmJjNGViZDUtZjQ4YS00YTgyLTk1YmQtYzM5YTMyNmZkY2ViIiwidCI6IjVmM2MyYmZjLTE5ZjktNDkyZC1hNTRhLWZkODJhNWRkNjMzOCJ9&pageName=23264a554ea505406574",
      srcMobile:  null,
      footerHeightDesktop: 60,
      footerHeightMobile: 60
    }
  };

  // Detecção de dispositivo (mobile por user agent ou tela estreita).
  function isMobileDevice(){
    var isMobileUA = /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);
    var isNarrowScreen = window.innerWidth <= 768;
    return isMobileUA || isNarrowScreen;
  }

  // Usa o valor informado (inclusive 0); só cai no padrão se não for um número válido.
  function alturaRodape(valor){
    return (typeof valor === "number" && isFinite(valor) && valor >= 0) ? valor : 60;
  }

  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  var relatorio = (id && Object.prototype.hasOwnProperty.call(RELATORIOS, id)) ? RELATORIOS[id] : null;

  if (relatorio) {
    var mobile = isMobileDevice();
    var src = (mobile && relatorio.srcMobile) ? relatorio.srcMobile : relatorio.srcDesktop;
    var footerHeight = alturaRodape(mobile ? relatorio.footerHeightMobile : relatorio.footerHeightDesktop);

    document.title = relatorio.title;

    var frame = document.getElementById("reportFrame");
    frame.style.setProperty("--footer-height", footerHeight + "px");
    frame.setAttribute("title", relatorio.title);
    frame.setAttribute("src", src);
  } else {
    document.getElementById("frameWrap").style.display = "none";
    document.getElementById("erroBox").classList.add("ativo");
  }
</script>

</body>
</html>
